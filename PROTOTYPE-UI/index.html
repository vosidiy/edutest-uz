<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Assessly teacher dashboard and student quiz player prototype">
  <meta name="theme-color" content="#101c2c">
  <title>Assessly — Assessment workspace</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101c2c'/%3E%3Cpath d='M18 45 30 17h6l12 28h-8l-2-6H27l-2 6h-7Zm12-13h6l-3-8-3 8Z' fill='%235ce0c0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Teacher navigation">
      <a class="brand" href="#dashboard" aria-label="Assessly home">
        <span class="brand-mark">A</span>
        <span>Assessly</span>
      </a>

      <nav class="side-nav">
        <a class="nav-item active" href="#dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
          Overview
        </a>
        <a class="nav-item" href="#quizzes" data-route="quizzes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v16H4V5h3V3Zm2 4h6V5H9v2Zm-1 4v2h8v-2H8Zm0 4v2h6v-2H8Z"/></svg>
          My quizzes
        </a>
        <a class="nav-item" href="#results" data-route="results">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Zm3 13v2h2v-2H8Zm0-5v4h2v-4H8Zm0-5v4h2V6H8Zm5 8v4h3v-4h-3Zm0-8v7h3V6h-3Z"/></svg>
          Results
        </a>
      </nav>

      <div class="side-bottom">
        <button class="profile-card" type="button">
          <span class="avatar">AK</span>
          <span class="profile-copy"><strong>Aziza Karimova</strong><small>Teacher workspace</small></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="page-eyebrow">Thursday, 17 September</p>
          <h1 id="page-title">Good morning, Aziza</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"/></svg>
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <a class="button primary" href="#builder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New quiz
          </a>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
